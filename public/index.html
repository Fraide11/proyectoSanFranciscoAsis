<!DOCTYPE html>
<html lang="es">
<head>
    <title>Auto-Repuestos San Francisco - Registro</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .form-container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registrar Nuevo Repuesto</h2>
    <form id="formRepuesto">
        <input type="text" id="codigo" placeholder="Código / SKU" required>
        <input type="text" id="nombre" placeholder="Nombre del repuesto" required>
        <input type="text" id="marcaCarro" placeholder="Marca (ej: Toyota)" required>
        <input type="text" id="modeloCarro" placeholder="Modelo (ej: Corolla)" required>
        <input type="number" id="precioVenta" placeholder="Precio de Venta" required>
        <input type="number" id="stock" placeholder="Stock Inicial" required>
        <button type="submit">Guardar Repuesto</button>
    </form>
    <p id="mensaje"></p>
</div>

<script>
    document.getElementById('formRepuesto').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const data = {
            codigo: document.getElementById('codigo').value,
            nombre: document.getElementById('nombre').value,
            marcaCarro: document.getElementById('marcaCarro').value,
            modeloCarro: document.getElementById('modeloCarro').value,
            precioVenta: document.getElementById('precioVenta').value,
            stock: document.getElementById('stock').value
        };

        try {
            const response = await fetch('/api/repuestos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const resData = await response.json();
            if (response.ok) {
                document.getElementById('mensaje').innerText = "✅ ¡Guardado con éxito!";
                document.getElementById('formRepuesto').reset();
            } else {
                document.getElementById('mensaje').innerText = "❌ Error: " + resData.message;
            }
        } catch (error) {
            console.error("Error al conectar:", error);
        }
    });
</script>
</body>
</html>
